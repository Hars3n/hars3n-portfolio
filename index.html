<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Harsen Schmidt</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap');

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --font:"Avenir Next","Avenir","Nunito",sans-serif;
  --w-m:500;--w-r:400;--w-l:300;
  --ink:#111;--paper:#fff;--muted:#999;
  --hh:60px;--pad:60px;
}
html{scroll-behavior:smooth;}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--font);font-weight:var(--w-r);
  overflow-x:hidden;cursor:none;
  -webkit-font-smoothing:antialiased;
}

/* CURSOR */
#cursor{
  position:fixed;width:10px;height:10px;
  background:var(--ink);border-radius:50%;
  pointer-events:none;z-index:9999;
  transform:translate(-50%,-50%);
  transition:width .25s ease,height .25s ease,background .2s ease,border-radius .25s ease;
  will-change:left,top;
}
#cursor.big{width:56px;height:56px;background:transparent;border:1.5px solid var(--ink);border-radius:50%;}
#cursor.text-mode{width:2px;height:28px;border-radius:1px;background:var(--ink);}
#cursor.link-mode{width:44px;height:44px;background:var(--ink);mix-blend-mode:difference;border-radius:50%;}

/* HEADER */
header{
  position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:500;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 var(--pad);
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.logo img{height:26px;width:auto;display:block;}
.logo-fallback{font-weight:var(--w-m);font-size:12px;letter-spacing:.1em;text-transform:uppercase;}

/* BURGER */
.burger{cursor:none;display:flex;flex-direction:column;gap:5px;padding:6px;z-index:600;-webkit-tap-highlight-color:transparent;}
.burger span{display:block;width:22px;height:1.5px;background:var(--ink);transition:transform .3s,opacity .3s;}
.burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.burger.open span:nth-child(2){opacity:0;}
.burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

/* NAV */
.nav-panel{
  position:fixed;top:calc(var(--hh) + 8px);right:var(--pad);
  background:var(--paper);border:1px solid #e0e0e0;
  padding:18px 28px;display:flex;flex-direction:column;align-items:flex-start;
  z-index:550;opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
}
.nav-panel.open{opacity:1;transform:translateY(0);pointer-events:auto;}
.nav-panel a{display:block;font-weight:var(--w-r);font-size:13px;color:var(--ink);text-decoration:none;line-height:1;margin-bottom:14px;white-space:nowrap;position:relative;}
.nav-panel a:last-child{margin-bottom:0;}
.nav-panel a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1px;background:var(--ink);transition:width .22s ease;}
.nav-panel a:hover::after{width:100%;}

/* OVERLAY */
.overlay{position:fixed;inset:0;pointer-events:none;z-index:140;}
.overlay.active{pointer-events:auto;}

/* MAIN */
main{padding-top:var(--hh);}

/* ── FIXED PREVIEW PANEL ───────────────────────────────────── */
/* Sits fixed on the right half of the screen, vertically centered */
#previewPanel{
  position:fixed;
  top:50%;right:0;
  width:38%;
  transform:translateY(-50%);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  z-index:200;
}
#previewInner{
  width:82%;
  opacity:0;
  transition:opacity .4s ease;
}
#previewInner.visible{opacity:1;}

/* standard single image */
#previewInner > img{
  width:100%;
  object-fit:contain;
  max-height:70vh;
  display:block;
}

/* custom layout (shared by projects 2, 3, 5, 6) */
#previewInner .custom-wrap{
  display:flex;flex-direction:column;gap:10px;width:100%;
}
#previewInner .custom-wrap .top-img{
  width:100%;object-fit:cover;height:200px;display:block;
}
#previewInner .custom-wrap .portrait-row{
  display:flex;gap:10px;width:100%;
}
#previewInner .custom-wrap .portrait-row img{
  flex:1;min-width:0;object-fit:cover;height:200px;display:block;
}
/* three equal vertical images side by side */
#previewInner .custom-wrap .triple-row{
  display:flex;gap:10px;width:100%;
}
#previewInner .custom-wrap .triple-row img{
  flex:1;min-width:0;object-fit:cover;height:240px;display:block;
}
#previewInner .custom-wrap .caption{
  font-size:11px;font-weight:300;color:#111;
  text-align:center;line-height:1.7;
}
#previewInner .custom-wrap .caption a{
  display:block;margin-top:4px;color:#111;
  text-decoration:underline;text-underline-offset:3px;
  pointer-events:auto;
}

/* HERO — full width, no right column */
.hero{min-height:100vh;display:flex;align-items:center;}
.hero-left{width:60%;padding:90px var(--pad);display:flex;flex-direction:column;justify-content:center;}

/* BIG NAME */
.big-name{
  font-weight:var(--w-m);
  font-size:clamp(48px,5.8vw,86px);
  letter-spacing:-.03em;line-height:.95;
  margin-bottom:52px;cursor:none;user-select:none;overflow:hidden;
}
.big-name .word{display:inline-block;white-space:nowrap;overflow:hidden;}
.big-name .letter{
  display:inline-block;
  transition:transform .35s cubic-bezier(.22,1,.36,1),font-weight .35s ease,font-style .35s ease,letter-spacing .35s ease;
  will-change:transform;
}

/* BIO */
.bio{font-weight:var(--w-r);font-size:clamp(18px,1.9vw,24px);line-height:1.7;max-width:520px;overflow-wrap:break-word;}
.bio .bchar{display:inline-block;transition:transform .25s cubic-bezier(.22,1,.36,1),opacity .25s ease;}
.bio .bchar.lifted{transform:translateY(-5px);opacity:.22;}
.bio .nl{display:block;margin-top:.55em;}

/* SCROLL HINT */
.scroll-hint{
  margin-top:56px;display:inline-flex;align-items:center;gap:12px;
  font-weight:var(--w-l);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  opacity:0;animation:fadeIn .6s .8s forwards;cursor:none;background:none;border:none;padding:0;text-decoration:none;
}
.scroll-line{width:40px;height:1px;background:var(--muted);animation:scrollLine 2.5s 1s ease-in-out infinite;transform-origin:left;flex-shrink:0;}
@keyframes scrollLine{0%{transform:scaleX(0);opacity:0;}30%,70%{transform:scaleX(1);opacity:1;}100%{transform:scaleX(0) translateX(40px);opacity:0;}}
@keyframes fadeIn{to{opacity:1;}}

/* INFO BLOCK */
.info-block{
  margin-top:64px;font-weight:var(--w-l);font-size:12px;
  line-height:1.9;color:var(--muted);letter-spacing:.01em;
  opacity:0;animation:fadeIn .6s 1s forwards;
}
.info-block a{color:var(--muted);text-decoration:none;position:relative;}
.info-block a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;background:var(--muted);transition:width .22s ease;}
.info-block a:hover::after{width:100%;}

/* PROJECTS SECTION */
#projets{padding:100px 0 160px;}
.projects-inner{width:60%;padding:0 var(--pad);}
.section-label{font-weight:var(--w-l);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:48px;}

/* PROJECT ITEM */
.project-item{padding:8px 0;cursor:none;position:relative;}
.project-header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;}
.project-title{font-weight:var(--w-m);font-size:clamp(17px,1.7vw,21px);letter-spacing:-.01em;line-height:1.3;position:relative;display:inline-block;}
.project-title::after{content:'';position:absolute;bottom:-1px;left:0;width:0;height:1px;background:var(--ink);transition:width .4s cubic-bezier(.77,0,.175,1);}
.project-item:hover .project-title::after{width:100%;}
.project-date{font-weight:var(--w-m);font-size:clamp(17px,1.7vw,21px);letter-spacing:-.01em;white-space:nowrap;flex-shrink:0;}
.project-sub{margin-top:2px;font-weight:var(--w-l);font-size:11px;color:var(--muted);line-height:1.4;}

/* MARQUEE */
.marquee-wrap{position:fixed;bottom:0;left:0;right:0;height:36px;overflow:hidden;pointer-events:none;z-index:50;opacity:0;transition:opacity .3s ease;}
.marquee-wrap.visible{opacity:1;}
.marquee-inner{display:flex;white-space:nowrap;animation:marquee 8s linear infinite;}
.marquee-inner span{font-weight:var(--w-l);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);opacity:.5;padding:9px 24px 0 24px;border-top:1px solid #e0e0e0;background:var(--paper);flex-shrink:0;}
@keyframes marquee{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}

/* INTRO ANIM */
.intro-line{overflow:hidden;display:block;}
.intro-word{display:inline-block;animation:wordIn .7s cubic-bezier(.22,1,.36,1) both;}
@keyframes wordIn{from{transform:translateY(110%);opacity:0;}to{transform:translateY(0);opacity:1;}}

/* MOBILE */
@media(max-width:768px){
  :root{--pad:24px;--hh:56px;}
  body{cursor:auto;}
  #cursor{display:none;}
  #previewPanel{display:none;}
  .hero{min-height:auto;}
  .hero-left{width:100%;padding:48px var(--pad) 56px;}
  .big-name{font-size:clamp(36px,11vw,52px);margin-bottom:28px;}
  .bio{font-size:17px;max-width:100%;}
  #projets{padding:60px 0 80px;}
  .projects-inner{width:100%;padding:0 var(--pad);}
  .project-item{cursor:pointer;}
  .project-title,.project-date{font-size:16px;}
  .section-label{margin-bottom:28px;}
  .nav-panel{right:var(--pad);top:calc(var(--hh)+6px);}
  .scroll-hint{margin-top:40px;}
  .info-block{margin-top:44px;font-size:11px;}
}
</style>
</head>

var cur = document.getElementById('cursor');
var mx=0,my=0,cx=0,cy=0;
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
(function raf(){cx+=(mx-cx)*.18;cy+=(my-cy)*.18;cur.style.left=cx+'px';cur.style.top=cy+'px';requestAnimationFrame(raf);})();

var navPanel=document.getElementById('navPanel');
var overlay=document.getElementById('overlay');
function toggleNav(f){
  var open=f!==undefined?f:!burger.classList.contains('open');

  navPanel.classList.toggle('open',open);
  overlay.classList.toggle('active',open);
}
burger.addEventListener('click',function(){toggleNav();});
overlay.addEventListener('click',function(){toggleNav(false);});
document.querySelectorAll('.nav-link').forEach(function(l){
  l.addEventListener('click',function(e){

    else{toggleNav(false);}
  });
});

/* BIG NAME */
var LETTER_VARIANTS=[
  {w:'300',s:'normal'},{w:'300',s:'italic'},{w:'400',s:'italic'},{w:'500',s:'italic'},{w:'400',s:'normal'}
];
function buildName(){
  var el=document.getElementById('bigName');
  el.innerHTML='';
  var words="Harsen Schmidt".split(' ');
  words.forEach(function(word,wi){
    if(wi>0){var sp=document.createElement('span');sp.style.cssText='display:inline-block;width:.28em;';el.appendChild(sp);}
    var ww=document.createElement('span');ww.className='word intro-line';
    word.split('').forEach(function(ch,ci){
      var s=document.createElement('span');s.className='letter intro-word';
      s.style.animationDelay=(wi*word.length+ci)*.04+'s';s.textContent=ch;
      s.addEventListener('mouseenter',function(){s.style.transform='translateY(-8px)';s.style.fontWeight='300';s.style.fontStyle='italic';s.style.letterSpacing='.04em';});
      s.addEventListener('mouseleave',function(){s.style.transform='';s.style.fontWeight='';s.style.fontStyle='';s.style.letterSpacing='';});
      s.addEventListener('click',function(){var v=LETTER_VARIANTS[Math.floor(Math.random()*LETTER_VARIANTS.length)];s.style.fontWeight=v.w;s.style.fontStyle=v.s;});
      ww.appendChild(s);
    });
    el.appendChild(ww);
  });
}
buildName();

/* BIO */
function antiOrphan(t){return t.replace(/ (\S{1,4})(?= )/g,function(_,w){return '\u00a0'+w;});}
function buildBio(){
  var el=document.getElementById('bioText');el.innerHTML='';
  var raw=[
    "Je suis \u00e9tudiant en deuxi\u00e8me ann\u00e9e de design graphique \u00e0 l'Initiative Paris, \u00e0 travers ce site je souhaite vous pr\u00e9senter les projets que j'ai pu r\u00e9aliser et qui me tiennent \u00e0 c\u0153ur ainsi que mon univers et ce qui me pla\u00eet dans le graphisme.",
    "Je vous souhaite une bonne visite\u00a0:)"
  ];
  raw.forEach(function(line,li){
    if(li>0){var nl=document.createElement('span');nl.className='nl';el.appendChild(nl);}
    antiOrphan(line).split(' ').forEach(function(word,wi){
      if(wi>0)el.appendChild(document.createTextNode(' '));
      var ws=document.createElement('span');ws.style.cssText='display:inline-block;white-space:nowrap;';
      Array.from(word).forEach(function(ch){
        var s=document.createElement('span');s.className='bchar';s.textContent=ch;
        s.addEventListener('mouseenter',function(){s.classList.add('lifted');setTimeout(function(){s.classList.remove('lifted');},350);});
        ws.appendChild(s);
      });
      el.appendChild(ws);
    });
  });
}
buildBio();

document.getElementById('bioText').addEventListener('mouseenter',function(){cur.classList.add('text-mode');});

function showPreview(p){
  previewInner.innerHTML = '';
  previewInner.appendChild(previewEls[p.id]);
  previewInner.classList.add('visible');
  var t = (p.title + ' \u2014 ' + p.date + '    ').repeat(6);
  mq1.textContent = t; mq2.textContent = t;
  marqueeEl.classList.add('visible');
  cur.classList.add('big');
}
function hidePreview(){
  previewInner.classList.remove('visible');
  marqueeEl.classList.remove('visible');
  cur.classList.remove('big');
}

/* PROJECTS LIST */
function buildProjects(){
  var list = document.getElementById('projectList');
  var mob = function(){return window.innerWidth<=768;};

  PROJECTS.forEach(function(p){
    var item = document.createElement('div');item.className='project-item';
    var hdr = document.createElement('div');hdr.className='project-header';
    var title = document.createElement('span');title.className='project-title';title.textContent=p.title;
    var date = document.createElement('span');date.className='project-date';date.textContent=p.date;
    hdr.appendChild(title);hdr.appendChild(date);item.appendChild(hdr);
    if(p.sub){var sub=document.createElement('p');sub.className='project-sub';sub.textContent=p.sub;item.appendChild(sub);}

    item.addEventListener('mouseenter',function(){
      if(mob())return;
      cur.classList.add('link-mode');
      showPreview(p);
    });
    item.addEventListener('mouseleave',function(){
      if(mob())return;
      cur.classList.remove('link-mode');
      hidePreview();
    });
    item.addEventListener('click',function(){window.location.href=p.page;});
    list.appendChild(item);
  });

  document.querySelectorAll('a,.burger').forEach(function(el){
    el.addEventListener('mouseenter',function(){cur.classList.add('link-mode');});
    el.addEventListener('mouseleave',function(){cur.classList.remove('link-mode');});
  });
}
buildProjects();

/* SCROLL parallax */
window.addEventListener('scroll',function(){
  var y = window.scrollY;
  var name = document.getElementById('bigName');
  name.style.transform = 'translateY('+(y*.12)+'px)';
  name.style.opacity = Math.max(0,1-y/420);
},{passive:true});
</script>
</body>
